<!--
  Quote — "Magic Link" email template
  Paste into: Supabase Dashboard → Authentication → Email Templates → Magic Link
  Subject:    [Quote] 로그인 코드 {{ .Token }}

  The app is OTP-first, so {{ .Token }} is shown prominently; the link is a
  fallback for tap-to-open on the same device.
-->
<div style="margin:0;padding:0;background:#f1f4f8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f4f8;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
          <tr>
            <td style="background:#00236f;padding:28px 32px;">
              <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.02em;">Quote</span>
              <span style="color:#aab6d8;font-size:13px;margin-left:8px;">나만의 독서 노트</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 8px;font-size:20px;color:#181c1f;font-weight:700;">로그인 코드</h1>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#444651;">
                Quote에 로그인하려면 아래 코드를 앱에 입력해 주세요.
              </p>

              <div style="background:#f1f4f8;border-radius:12px;padding:20px;text-align:center;margin-bottom:24px;">
                <div style="font-size:32px;font-weight:700;letter-spacing:8px;color:#00236f;font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;">{{ .Token }}</div>
              </div>

              <p style="margin:0 0 24px;font-size:13px;line-height:1.6;color:#757682;">
                또는 아래 버튼을 눌러 이 기기에서 바로 로그인할 수 있습니다.
              </p>

              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 8px;">
                <tr>
                  <td style="border-radius:10px;background:#00236f;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">앱에서 로그인</a>
                  </td>
                </tr>
              </table>

              <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#9aa0ab;">
                본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다. 코드는 잠시 후 만료됩니다.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;border-top:1px solid #e0e3e7;">
              <p style="margin:0;font-size:12px;color:#9aa0ab;">
                © 2026 <a href="https://tealdot.dev" style="color:#757682;text-decoration:none;">Tealdot</a>
                · Quote · <a href="https://quote.tealdot.dev" style="color:#757682;text-decoration:none;">quote.tealdot.dev</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
